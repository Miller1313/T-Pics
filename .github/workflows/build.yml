name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'worker/**'
      - 'firebase/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk T-Pics.apk

      - uses: actions/upload-artifact@v4
        with:
          name: T-Pics
          path: T-Pics.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: T-Pics 2.0.${{ github.run_number }}
          files: T-Pics.apk
          make_latest: true
